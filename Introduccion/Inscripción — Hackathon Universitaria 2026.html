<!DOCTYPE html>
<!-- saved from url=(0088)https://e-aulas.urosario.edu.co/pluginfile.php/3824980/mod_resource/content/0/index.html -->
<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción — Hackathon Universitaria 2026</title>

  <!-- ============================================================
       ESTILOS DE APOYO — NO MODIFICAR NI AGREGAR CSS.
       Esta actividad se evalúa SOLO sobre HTML.
       ============================================================ -->
  <style>
    body{font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:24px;background:#f6f7f9;color:#1a1a1a;line-height:1.5}
    h1{font-size:1.5rem;margin-bottom:.25rem}
    .intro{color:#555;margin-top:0}
    form{background:#fff;border:1px solid #ddd;border-radius:8px;padding:20px}
    fieldset{border:1px solid #d6d6d6;border-radius:6px;margin:0 0 20px;padding:16px}
    legend{font-weight:700;padding:0 6px}
    label{display:block;margin:12px 0 4px;font-weight:600;font-size:.9rem}
    input,select,textarea{width:100%;padding:8px;border:1px solid #bbb;border-radius:4px;font:inherit;box-sizing:border-box}
    input[type=radio],input[type=checkbox]{width:auto;margin-right:6px}
    input[type=range],input[type=color]{padding:0}
    .inline label{display:inline-block;font-weight:400;margin-right:16px}
    button{padding:10px 18px;border:0;border-radius:4px;font:inherit;cursor:pointer;margin-right:8px}
    button[type=submit]{background:#2563eb;color:#fff}
    button[type=reset]{background:#e5e7eb}
    small{color:#666;font-weight:400;display:block;margin-top:2px}
    input:user-invalid,select:user-invalid,textarea:user-invalid{border-color:#dc2626;background:#fff5f5}
    .todo{background:#fffbe6;border-left:4px solid #f59e0b;padding:10px 14px;margin:12px 0;font-size:.85rem}
  </style>
</head>
<body>

  <h1>Hackathon Universitaria 2026</h1>
  <p class="intro">Completa el formulario de inscripción. Tiempo estimado: 30 minutos.</p>

  <!-- ============================================================
       TODO 0 — Cierra correctamente la etiqueta <form>.
       Debe enviar los datos a "procesar-inscripcion.php"
       usando el método que NO expone los datos en la URL.
       ============================================================ -->
  <form action="https://e-aulas.urosario.edu.co/pluginfile.php/3824980/mod_resource/content/0/________" method="________">

    <!-- ========================================================
         BLOQUE 1 — DATOS PERSONALES  (ya resuelto: es tu modelo)
         Observa cómo se usan:
           · <fieldset> + <legend> para agrupar
           · <label for="..."> enlazado con el id del campo
           · name  -> nombre con el que viaja el dato
           · required, minlength, autocomplete
         ======================================================== -->


    <fieldset>
      <legend>1. Datos personales</legend>

      <label for="nombre">Nombre completo *</label>
      <input type="text" id="nombre" name="nombre" placeholder="Ana María Restrepo" minlength="5" maxlength="60" autocomplete="name" required="">

      <label for="correo">Correo institucional *</label>
      <input type="email" id="correo" name="correo" placeholder="ana.restrepo@universidad.edu.co" autocomplete="email" required="">
      <small>Debe ser un correo válido.</small>
    </fieldset>


    <!-- ========================================================
         BLOQUE 2 — CONTACTO Y FECHAS
         ======================================================== -->
    <fieldset>
      <legend>2. Contacto y fechas</legend>

      <!-- TODO 1 --------------------------------------------------
           Campo "Celular":
             · tipo de input adecuado para un teléfono
             · id y name = "celular"
             · obligatorio
             · pattern que acepte EXACTAMENTE 10 dígitos
             · title con el mensaje de ayuda "Debe tener 10 dígitos"
           --------------------------------------------------------- -->

          <label for="celular">Celular *</label>
          <input type="tel" id="celular" name="celular" required pattern="[0-9]{10}" title="Debe tener 10 dígitos" required placeholder="Ejemplo: 3160993798"><br>
          <small>Debe tener 10 dígitos.</small>


      <!-- TODO 2 --------------------------------------------------
           Campo "Fecha de nacimiento":
             · input de tipo fecha
             · id y name = "nacimiento"
             · obligatorio
             · no permitir fechas posteriores al 2010-12-31 (min/max)
           --------------------------------------------------------- -->

          <label for="nacimiento">Fecha de nacimiento *</label>
           <input type="date" id="nacimiento" name="nacimiento" required max="2010-12-31" required min="2000-12-31 "><br>

      <!-- TODO 3 --------------------------------------------------
           Campo "Portafolio web" (opcional):
             · input de tipo URL
             · id y name = "portafolio"
             · placeholder "https://..."
             · NO obligatorio
           --------------------------------------------------------- -->
          <label for="portafolio">Portafolio web</label>
          <input type="url" id="portafolio" name="portafolio" placeholder="https://..." autocomplete="url">
    </fieldset>


    <!-- ========================================================
         BLOQUE 3 — PERFIL DEL PARTICIPANTE
         ======================================================== -->
    <fieldset>
      <legend>3. Perfil del participante</legend>

      <!-- TODO 4 --------------------------------------------------
           Lista desplegable "Programa académico":
             · <select> con id y name = "programa", obligatorio
             · primera opción deshabilitada y seleccionada:
               "-- Selecciona --" (sin value)
             · usa DOS <optgroup>:
                 "Ingeniería"  -> Sistemas, Industrial, Electrónica
                 "Diseño"      -> Gráfico, Multimedia
           --------------------------------------------------------- -->
      <label for="programa">Programa académico *</label>
      <select id="programa" name="programa" required>
        <option value="" disabled selected>-- Selecciona --</option>
        <optgroup label="Ingeniería">
          <option value="sistemas">Sistemas</option>
          <option value="industrial">Industrial</option>
          <option value="electronica">Electrónica</option>
        </optgroup>
        <optgroup label="Diseño">
          <option value="grafico">Gráfico</option>
          <option value="multimedia">Multimedia</option>
        </optgroup>
      </select>

      <!-- TODO 5 --------------------------------------------------
           Grupo de botones de radio "Nivel de experiencia":
             · tres opciones: Básico, Intermedio, Avanzado
             · TODAS comparten el mismo name = "nivel" (esto es lo
               que las vuelve excluyentes)
             · cada una con su id propio y su <label for="...">
             · el grupo es obligatorio
             · "Básico" viene marcado por defecto
             · envuelve el grupo en <div class="inline"> ... </div>
           --------------------------------------------------------- -->
      <label for="nivel">Nivel de experiencia *</label>
      <div class="inline">
        <input type="radio" id="basico" name="nivel" value="basico" checked required>
        <label for="basico">Básico</label>
        <input type="radio" id="intermedio" name="nivel" value="intermedio" required>
        <label for="intermedio">Intermedio</label>
        <input type="radio" id="avanzado" name="nivel" value="avanzado" required>
        <label for="avanzado">Avanzado</label>
      </div>


      <!-- TODO 6 --------------------------------------------------
           Casillas de verificación "Tecnologías que dominas":
             · cuatro checkbox: HTML, CSS, JavaScript, Python
             · todas con name = "tecnologias" (permite varias)
             · value en minúscula: html, css, javascript, python
             · cada una con su id y su <label for="...">
             · NO son obligatorias
             · envuelve el grupo en <div class="inline"> ... </div>
           --------------------------------------------------------- -->
      

      <!-- TODO 7 --------------------------------------------------
           Campo numérico "Horas semanales disponibles":
             · input de tipo number, id y name = "horas"
             · mínimo 5, máximo 40, incrementos de 5
             · valor inicial 10, obligatorio
           --------------------------------------------------------- -->
      <label for="horas">Horas semanales disponibles *</label>
        <input type="number" id="horas" name="horas" min="5" max="40" step="5" value="10" required>


    <!-- ========================================================
         BLOQUE 4 — MATERIALES Y COMENTARIOS
         ======================================================== -->
    <fieldset>
      <legend>4. Materiales y comentarios</legend>

      <!-- TODO 8 --------------------------------------------------
           Campo "Hoja de vida (PDF)":
             · input de tipo file, id y name = "hojavida"
             · aceptar únicamente archivos .pdf (atributo accept)
           PISTA: para que un formulario con archivos funcione de
           verdad, el <form> necesita además el atributo
           enctype="multipart/form-data"  -> agrégalo en el TODO 0.
           --------------------------------------------------------- -->
      <label for="hojavida">Hoja de vida (PDF) *</label>
        <input type="file" id="hojavida" name="hojavida" accept=".pdf">


      <!-- TODO 9 --------------------------------------------------
           Área de texto "¿Por qué quieres participar?":
             · <textarea> con id y name = "motivacion"
             · 4 filas (rows)
             · máximo 300 caracteres
             · obligatorio
             · placeholder libre
           --------------------------------------------------------- -->
      <label for="motivacion">¿Por qué quieres participar? *</label>
        <textarea id="motivacion" name="motivacion" rows="4" maxlength="300" required placeholder="Escribe aquí tu motivación..."
        ></textarea>


      <!-- TODO 10 -------------------------------------------------
           Casilla única de aceptación:
             · checkbox con id y name = "terminos"
             · OBLIGATORIO
             · label: "Acepto el tratamiento de mis datos personales *"
           --------------------------------------------------------- -->
      <input type="checkbox" id="terminos" name="terminos" required>
        <label for="terminos">Acepto el tratamiento de mis datos personales *</label>


    <!-- TODO 11 -----------------------------------------------------
         Botones del formulario:
           · un botón que ENVÍA el formulario, texto "Enviar inscripción"
           · un botón que LIMPIA el formulario, texto "Borrar"
         (usa la etiqueta <button> con el type correcto en cada caso)
         ------------------------------------------------------------- -->
      <button type="submit">Enviar inscripción</button>
      <button type="reset">Borrar</button>

  <!-- TODO 0 (cierre) — falta la etiqueta de cierre del formulario -->
</form>


</form><style>#myIframe { position:absolute; top: 0px; left: 0px; } @media print {  #myIframe { min-width: 100% ;   max-width: 100%;  width: 100%;  border: none; } body {width: 21cm; height: 100%; max-width: 21cm; }  html {height: 100%; width: 21cm; max-width: 21cm;}  @page { margin: 0.4;} }</style></body></html>
